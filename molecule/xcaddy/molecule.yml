---
role_name_check: 1

driver:
  name: docker

platforms:
  - name: debian13
    image: >-
      geerlingguy/docker-debian13-ansible@sha256:6a0fdd2e0f9b0150d697dfe36a919a9965224a87f9ccad7cf6376383bec7207d
    command: ""
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - check
    - idempotence
    - verify
    - destroy
