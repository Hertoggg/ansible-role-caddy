---
name: ci

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The xcaddy scenario compiles Caddy from source with a Go toolchain it
    # downloads first, so this needs considerably more than a lint run.
    timeout-minutes: 45
    steps:
      - name: Check out the role
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install -r requirements-test.txt

      - name: Lint the complete role
        run: |
          . .venv/bin/activate
          ansible-lint

      # Both scenarios: the apt path with the full site matrix, and the xcaddy
      # path that this role's callers actually run in production.
      - name: Test Debian 13 convergence and idempotence
        run: |
          . .venv/bin/activate
          molecule test --all
