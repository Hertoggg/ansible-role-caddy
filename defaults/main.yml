---
# ----------------------------------------------------------------------------
# Install
# ----------------------------------------------------------------------------

# "apt"    — install from Caddy's official cloudsmith apt repo (default)
# "xcaddy" — build a custom binary; requires caddy_extra_modules to be useful
caddy_install_method: apt

# Only used when caddy_install_method: xcaddy
# List of module import paths, e.g.:
#   - github.com/caddy-dns/cloudflare
#   - github.com/caddyserver/cache-handler
caddy_extra_modules: []

# Go version to install when using xcaddy (ignored for apt)
caddy_go_version: "1.22"

# Extra environment variables for the xcaddy build command, merged over the
# defaults (HOME, GOPATH). Needed e.g. to build private modules:
#   caddy_xcaddy_env:
#     GOPRIVATE: "github.com/myuser/*"
# (git credentials for the private fetch must be provided separately,
# e.g. a /root/.netrc deployed by the calling playbook)
caddy_xcaddy_env: {}

# ----------------------------------------------------------------------------
# Paths & ownership
# ----------------------------------------------------------------------------

caddy_config_dir: /etc/caddy
caddy_caddyfile: /etc/caddy/Caddyfile
caddy_data_dir: /var/lib/caddy
caddy_log_dir: /var/log/caddy

caddy_user: caddy
caddy_group: caddy

# ----------------------------------------------------------------------------
# Caddyfile template
# ----------------------------------------------------------------------------

# Jinja2 template filename (relative to the role's templates/ dir) or an
# absolute path to a caller-supplied template. Set to "" to skip deployment.
caddy_caddyfile_template: Caddyfile.j2

# ----------------------------------------------------------------------------
# systemd
# ----------------------------------------------------------------------------

# Environment variables injected into the caddy.service drop-in.
# Key-value dict, e.g.:
#   GODEBUG: tlsmlkem=0
caddy_systemd_env: {}

# ----------------------------------------------------------------------------
# TLS / global options
# ----------------------------------------------------------------------------

caddy_acme_email: ""

# Global ACME DNS-01 challenge provider, written verbatim as the global
# `acme_dns <value>` option. When set, every managed site obtains its
# certificate over DNS-01 instead of HTTP/TLS-ALPN — required for wildcard
# hosts and for hosts whose public A record does not point at this server
# (e.g. split-horizon / internal HTTPS behind an external ingress).
#
# The referenced DNS provider module must be compiled in via
# caddy_install_method: xcaddy + caddy_extra_modules, and any API token
# supplied through caddy_systemd_env. Example (Cloudflare):
#   caddy_install_method: xcaddy
#   caddy_extra_modules: [github.com/caddy-dns/cloudflare]
#   caddy_systemd_env: { CF_API_TOKEN: "{{ vault_cf_token }}" }
#   caddy_acme_dns: "cloudflare {env.CF_API_TOKEN}"
caddy_acme_dns: ""

# Raw Caddyfile directives injected verbatim into the global options block,
# for global options this role does not model explicitly. Multi-line ok.
#
# The clustering case this exists for: two Caddy nodes behind one floating IP
# cannot both answer an ACME challenge, because only the node currently
# holding the IP receives the request. Pointing both at one shared storage
# backend gives them a common certificate store and a common issuance lock, so
# whichever node holds the IP issues and both serve the result. Requires the
# matching storage module compiled in via caddy_install_method: xcaddy.
#
#   caddy_install_method: xcaddy
#   caddy_extra_modules: [github.com/pberkel/caddy-storage-redis]
#   caddy_global_extra: |
#     storage redis {
#         address 10.0.0.5:6379
#         password "{{ vault_redis_password }}"
#         db 3
#     }
caddy_global_extra: ""

# ----------------------------------------------------------------------------
# Sites
# ----------------------------------------------------------------------------

# List of reverse-proxy sites. Each entry supports:
#   host:             required — public hostname
#   upstream:         required — backend address (host:port). Several,
#                                space-separated, makes this a load-balanced
#                                site; see lb_policy below.
#   lb_policy:        optional — Caddy load balancing policy across multiple
#                                upstreams (round_robin, least_conn, ip_hash,
#                                cookie, ...). Default is Caddy's own (random).
#   health_uri:       optional — path for ACTIVE health checks. Without it
#                                Caddy only marks an upstream down after a
#                                request to it has already failed (passive),
#                                so the first user after a backend dies eats
#                                the error. With it, Caddy polls out of band
#                                and takes the backend out before that.
#   health_interval:  optional — how often to poll (default 30s)
#   health_timeout:   optional — per-probe timeout
#   health_status:    optional — acceptable status, e.g. 2xx (default 200)
#   fail_duration:    optional — how long a passively-failed upstream stays
#                                out of rotation (default 0 = passive checks
#                                disabled)
#   lb_retries:       optional — retries against other upstreams before giving
#                                up on a request
#   access_log:       optional — enable per-site JSON access log at
#                                {{ caddy_log_dir }}/<host>.access.log
#   allow_ips:        optional — whole-site IP allowlist (list of IPs/CIDRs)
#   protected_paths:  optional — list of { path, allow_ips } for per-path restrictions
#   import_snippets:  optional — list of caddy_snippets names to `import` into the site
#   import_files:     optional — list of file paths to `import` into the site (e.g. a
#                                runtime-managed snippet owned by another process)
#   extra_directives: optional — raw Caddyfile directives injected verbatim into the
#                                site block, just before reverse_proxy (multi-line ok)
caddy_sites: []

# Reusable Caddy snippets, rendered as `(name) { body }` at the top of the
# Caddyfile. A site pulls one in with `import_snippets: [name]`. Body is raw
# Caddyfile. Example:
#
# caddy_snippets:
#   security_headers: |
#     header {
#         Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#         X-Content-Type-Options nosniff
#         X-Frame-Options DENY
#         Referrer-Policy strict-origin-when-cross-origin
#         -Server
#     }
#   compression: |
#     encode zstd gzip
caddy_snippets: {}

# Expose a Prometheus metrics + health endpoint on this address/port.
# Set caddy_metrics_bind to "" to disable the metrics server entirely.
caddy_metrics_bind: ""
caddy_metrics_port: 9090
caddy_metrics_allow_ips: []
